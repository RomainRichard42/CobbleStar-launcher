name: Publier le launcher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l’installateur
        run: npm run dist:win

      - name: Vérifier les fichiers de mise à jour
        shell: pwsh
        run: |
          if (-not (Test-Path "release/latest.yml")) { throw "latest.yml est absent" }
          if (-not (Get-ChildItem "release/*.exe")) { throw "L'installateur EXE est absent" }
          if (-not (Get-ChildItem "release/*.exe.blockmap")) { throw "Le blockmap est absent" }

      - name: Publier tous les fichiers dans la Release
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release/*.exe \
            release/*.exe.blockmap \
            release/latest.yml \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
